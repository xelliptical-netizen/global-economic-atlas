<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Economic & Historical Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #map-wrapper {
            flex: 1;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            position: relative;
            margin-bottom: 10px;
            z-index: 10;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: -0.025em;
        }

        header p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        #sidebar {
            width: 420px;
            background-color: #1e293b;
            border-left: 1px solid #334155;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.25);
        }

        .sidebar-padding {
            padding: 2rem;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }

        .placeholder-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            stroke: #475569;
        }

        .country-title {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #38bdf8;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .history-box {
            background-color: #0f172a;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid #334155;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: justify;
        }

        .map-error-banner {
            padding: 20px;
            background-color: #7f1d1d;
            border: 1px solid #f87171;
            color: #fca5a5;
            border-radius: 6px;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
        }

        .jvm-zoom-btn {
            background-color: #334155 !important;
            color: #f8fafc !important;
            border-radius: 4px !important;
            border: none !important;
        }
        .jvm-tooltip {
            background: #334155 !important;
            font-family: inherit !important;
            font-size: 0.85rem !important;
            padding: 6px 12px !important;
            border-radius: 4px !important;
            border: none !important;
        }
    </style>
</head>
<body>

    <div id="map-wrapper">
        <header>
            <h1>Global Economic & Historical Atlas</h1>
            <p>Click on any sovereign UN member nation to examine its profile.</p>
        </header>
        <div id="map" role="application" aria-label="Interactive World Map Atlas"></div>
    </div>

    <div id="sidebar" role="complementary" aria-label="Country Profile Details">
        <div id="sidebar-content" class="placeholder-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18" />
            </svg>
            <p>Select a country on the map to display its core macro indicators and historical overview.</p>
        </div>
    </div>

        function displayCountryProfile(targetDataset) {
            const container = document.getElementById("sidebar-content");
            container.className = "sidebar-padding";
            container.textContent = "";

            const titleRow = document.createElement("div");
            titleRow.className = "country-title";
            const titleText = document.createElement("span");
            titleText.textContent = targetDataset.name;
            titleRow.appendChild(titleText);
            container.appendChild(titleRow);

            const statsLabel = document.createElement("div");
            statsLabel.className = "section-label";
            statsLabel.textContent = "Macroeconomic Profile";
            container.appendChild(statsLabel);

            const statsGrid = document.createElement("div");
            statsGrid.className = "stats-grid";

            const metrics = [
                { label: "Nominal GDP", value: targetDataset.gdp },
                { label: "GDP Per Capita", value: targetDataset.gdpCapita },
                { label: "Annual Growth", value: targetDataset.growth, isGrowth: true },
                { label: "Total Population", value: targetDataset.pop },
                { label: "Human Dev. Index (HDI)", value: targetDataset.hdi },
                { label: "Corruption Index", value: targetDataset.cpi }
            ];

            metrics.forEach(metric => {
                const card = document.createElement("div");
                card.className = "stat-card";

                const labelNode = document.createElement("div");
                labelNode.className = "label";
                labelNode.textContent = metric.label;
                card.appendChild(labelNode);

                const valueNode = document.createElement("div");
                valueNode.className = "value";
                valueNode.textContent = metric.value;

                if (metric.isGrowth) {
                    const numericGrowth = parseFloat(metric.value);
                    if (!isNaN(numericGrowth)) {
                        if (numericGrowth < 0) {
                            valueNode.style.color = "#ef4444";
                            valueNode.textContent = "▼ " + metric.value;
                        } else if (numericGrowth > 0) {
                            valueNode.style.color = "#22c55e";
                            valueNode.textContent = "▲ " + metric.value;
                        } else {
                            valueNode.style.color = "#94a3b8";
                        }
                    }
                }

                card.appendChild(valueNode);
                statsGrid.appendChild(card);
            });
            container.appendChild(statsGrid);

            const historyLabel = document.createElement("div");
            historyLabel.className = "section-label";
            historyLabel.textContent = "Historical Insight";
            container.appendChild(historyLabel);

            const historyBox = document.createElement("div");
            historyBox.className = "history-box";
            historyBox.textContent = targetDataset.history;
            container.appendChild(historyBox);
        }

        // FIX: Improved error catch block now logs the full error stack for easier debugging
        try {
            const mapInstance = new jsVectorMap({
                selector: "#map",
                map: "world",
                backgroundColor: "transparent",
                draggable: true,
                zoomOnScroll: true,

                regionStyle: {
                    initial: {
                        fill: "#334155",
                        fillOpacity: 1,
                        stroke: "#0f172a",
                        strokeWidth: 1.5,
                        strokeOpacity: 1
                    },
                    hover: {
                        fill: "#38bdf8",
                        cursor: "pointer"
                    },
                    selected: {
                        fill: "#0ea5e9"
                    }
                },

                onRegionClick: function(event, code) {
                    const normalizedCode = code.toUpperCase();
                    const targetDataset = countryDataMatrix[normalizedCode];

                    if (targetDataset) {
                        displayCountryProfile(targetDataset);
                    } else {
                        const container = document.getElementById("sidebar-content");
                        container.className = "sidebar-padding";
                        container.textContent = "";

                        const titleRow = document.createElement("div");
                        titleRow.className = "country-title";
                        titleRow.textContent = "Data Unavailable";
                        container.appendChild(titleRow);

                        const fallbackMessage = document.createElement("div");
                        fallbackMessage.className = "history-box";
                        fallbackMessage.textContent = `Detailed economic indicators and comprehensive matrix analytics are currently unregistered for country domain [${normalizedCode}].`;
                        container.appendChild(fallbackMessage);
                    }
                }
            });

            window.atlasMapInstance = mapInstance;

        } catch (error) {
            // FIX: Full error details now logged to browser console for debugging
            console.error("Vector Map Engine initialization halted:", error.message, error.stack);
            const mapContainer = document.getElementById("map");
            if (mapContainer) {
                mapContainer.textContent = "";
                const errorBanner = document.createElement("div");
                errorBanner.className = "map-error-banner";
                errorBanner.textContent = "Unable to render mapping resources. Please verify connection integrity to the atlas visualization servers.";
                mapContainer.appendChild(errorBanner);
            }
        }
    </script>
