<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Economic & Historical Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0f172a; /* Deep Slate Blue */
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Map Viewport Area */
        #map-wrapper {
            flex: 1;
            position: relative;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 10px;
            z-index: 10;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: -0.025em;
        }

        header p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* Interactive Sidebar Configuration */
        #sidebar {
            width: 420px;
            background-color: #1e293b; /* Charcoal/Slate */
            border-left: 1px solid #334155;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.25);
        }

        /* Sidebar Content Formatting */
        .sidebar-padding {
            padding: 2rem;
        }

        /* Placeholder State (When no country is clicked yet) */
        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #64748b;
            padding: 2rem;
        }

        .placeholder-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            stroke: #475569;
        }

        /* Populated Active State Layout */
        .country-title {
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #38bdf8;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        /* Metric Grid Architecture */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Narrative/History Architecture */
        .history-box {
            background-color: #0f172a;
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid #334155;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #cbd5e1;
            text-align: justify;
        }

        /* Map styling adjustments */
        .jvm-zoom-btn {
            background-color: #334155 !important;
            color: #f8fafc !important;
            border-radius: 4px !important;
            border: none !important;
        }
        .jvm-tooltip {
            background: #334155 !important;
            font-family: inherit !important;
            font-size: 0.85rem !important;
            padding: 6px 12px !important;
            border-radius: 4px !important;
            border: none !important;
        }
    </style>
</head>
<body>

        </header>
        <div id="map"></div>

    <div id="sidebar">

                <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 9.152c.582.448 1.148.89 1.676 1.345m-1.676-1.345c-.58-.447-1.143-.883-1.67-1.332m1.67.031zM20.5 10.5a8 8 0 1 1-16 0 8 8 0 0 1 16 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />

        </div>
    </div>
