<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Economic & Development Atlas</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap/dist/css/jsvectormap.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 2.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #f8fafc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--muted-text);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        #map-container {
            width: 90vw;
            max-width: 1200px;
            height: 650px;
            margin: 2rem 0;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Tooltip Styling */
        .jvm-tooltip {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid #475569 !important;
            border-radius: 12px !important;
            padding: 16px !important;
            font-family: inherit !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6) !important;
            color: var(--text-color) !important;
            backdrop-filter: blur(4px);
        }

        .tooltip-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .tooltip-grid {
            display: grid;
            grid-template-columns: auto auto;
            gap: 8px 24px;
            font-size: 0.95rem;
        }

        .tooltip-label {
            color: var(--muted-text);
            font-weight: 500;
        }

        .tooltip-value {
            font-weight: 600;
            text-align: right;
        }
    </style>
</head>

                backgroundColor: 'transparent',

                regionStyle: {

                    }

                    const data = countryMetrics[code] || {
                        name: tooltip.text(),
                        gdp: "N/A", gdpCapita: "N/A", pop: "N/A", hdi: "N/A", cpi: "N/A", growth: "N/A"

                    const growthColor = isNegative ? '#f87171' : (data.growth === 'N/A' ? 'var(--text-color)' : '#4ade80');

                    const htmlLayout = `
                        <div class="tooltip-title">${data.name}</div>
                        <div class="tooltip-grid">

                            <div class="tooltip-value">${data.gdp}</div>

                            <div class="tooltip-label">Population:</div>

                            <div class="tooltip-label">Expected Growth:</div>
                            <div class="tooltip-value" style="color: ${growthColor}">${data.growth}</div>
                        </div>
                    `;
                    tooltip.text(htmlLayout, true);
                }
